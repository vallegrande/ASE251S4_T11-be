apiVersion: apps/v1
kind: Deployment
metadata:
  name: agrimarket-backend
  namespace: brando-lucana-agrimarket-be
  labels:
    app: agrimarket-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agrimarket-backend
  template:
    metadata:
      labels:
        app: agrimarket-backend
    spec:
      containers:
        - name: agrimarket-backend
          image: agrimarket-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: mongodb-credentials
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 35
            periodSeconds: 15
